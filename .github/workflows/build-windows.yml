name: Сборка приложения для Windows

on:
  # Запуск вручную: вкладка Actions -> эта сборка -> Run workflow
  workflow_dispatch:
  # Автоматически, когда вы создаёте версию вида v2.1.0 (файл .exe появится в релизе)
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Установка инструментов и сборка веб-части
        shell: bash
        working-directory: standalone
        run: |
          npm install --no-audit --no-fund
          node build.mjs

      - name: Сборка установщика для Windows
        shell: bash
        run: ./standalone/node_modules/.bin/tauri build --bundles nsis

      - name: Сохранить файл для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: Klavir-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe

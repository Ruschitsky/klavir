name: Сборка приложения для Mac

on:
  # Запуск вручную: вкладка Actions -> эта сборка -> Run workflow
  workflow_dispatch:
  # Автоматически, когда вы создаёте версию вида v2.1.0 (появится готовый релиз с файлом .dmg)
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Установка инструментов и сборка веб-части
        working-directory: standalone
        run: |
          npm install --no-audit --no-fund
          node build.mjs

      - name: Сборка приложения (одно для Apple Silicon и Intel)
        run: ./standalone/node_modules/.bin/tauri build --target universal-apple-darwin

      - name: Сохранить файл для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: Klavir-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
